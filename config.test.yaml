# 1. 引入基础配置 (可选，也可以直接写在这里)
# 这里用 `include` 指令合并 base.yaml (shared across providers)
# Clash基础配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
hosts:
clash-for-android:
  append-system-dns: false
profile:
  tracing: true
  store-selected: true
  store-fake-ip: true
tproxy-port: 7895
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
ipv6: false
geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
dns:
  enable: true
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  nameserver:
    [
      "https://zone.rlose.com:39933/api-query",
      "https://radar.workrent.net:39933/api-query",
    ]
  fallback:
    [
      "tls://8.8.4.4:853",
      "https://dns.cloudflare.com/dns-query",
      "https://koala.madns-lemon.site:2443/dns-query",
      "https://whale.madns-peach.site:2443/dns-query",
      "https://otter.madns-pear.site:2443/dns-query",
      "https://rhino.madns-berry.site:2443/dns-query",
      "https://cobra.madns-cherry.site:2443/dns-query",
      "https://dns.twnic.tw/dns-query",
    ]
  fallback-filter: {
      geoip: true,
      # geoip-code: CN,
      # geosite: [gfw],
      ipcidr: [240.0.0.0/4, 0.0.0.0/32],
    }
  fake-ip-filter:
    [
      "*.lan",
      "*.linksys.com",
      "*.linksyssmartwifi.com",
      swscan.apple.com,
      mesu.apple.com,
      swquery.apple.com,
      swdownload.apple.com,
      swcdn.apple.com,
      swdist.apple.com,
      "*.msftconnecttest.com",
      "*.msftncsi.com",
      "xbox.*.microsoft.com",
      "xbox.*.*.microsoft.com",
      +.xboxlive.com,
      "time.*.com",
      "time.*.gov",
      "time.*.edu.cn",
      "time.*.apple.com",
      "time1.*.com",
      "time2.*.com",
      "time3.*.com",
      "time4.*.com",
      "time5.*.com",
      "time6.*.com",
      "time7.*.com",
      "ntp.*.com",
      "ntp.*.com",
      "ntp1.*.com",
      "ntp2.*.com",
      "ntp3.*.com",
      "ntp4.*.com",
      "ntp5.*.com",
      "ntp6.*.com",
      "ntp7.*.com",
      "*.time.edu.cn",
      "*.ntp.org.cn",
      +.pool.ntp.org,
      time1.cloud.tencent.com,
      lens.l.google.com,
      +.music.163.com,
      +.126.net,
      musicapi.taihe.com,
      music.taihe.com,
      songsearch.kugou.com,
      trackercdn.kugou.com,
      "*.kuwo.cn",
      api-jooxtt.sanook.com,
      api.joox.com,
      joox.com,
      +.y.qq.com,
      +.music.tc.qq.com,
      aqqmusic.tc.qq.com,
      +.stream.qqmusic.qq.com,
      +.xiami.com,
      +.music.migu.cn,
      "+.stun.*.*",
      "+.stun.*.*.*",
      "+.stun.*.*.*.*",
      "+.stun.*.*.*.*.*",
      +.srv.nintendo.net,
      "*.n.n.srv.nintendo.net",
      +.stun.playstation.net,
      +.battlenet.com.cn,
      +.wotgame.cn,
      +.wggames.cn,
      +.wowsgame.cn,
      +.wargaming.net,
      "*.square-enix.com",
      "*.finalfantasyxiv.com",
      "*.ffxiv.com",
      "*.ff14.sdo.com",
      ff.dorado.sdo.com,
      localhost.ptlogin2.qq.com,
      localhost.sec.qq.com,
      proxy.golang.org,
      +.qq.com,
      +.baidu.com,
      +.163.com,
      +.126.net,
      +.taobao.com,
      +.jd.com,
      +.tmall.com,
      "*.mcdn.bilivideo.cn",
      +.nvidia.com,
      +.nvidia.cn,
      +.nvgs.nvidia.com,
      +.nvgs.nvidia.cn,
      shark007.net,
    ]

